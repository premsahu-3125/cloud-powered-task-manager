server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side. Without this, refreshing
    # a deep link like /tasks/new or /dashboard would 404, because nginx
    # would otherwise look for a literal file at that path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively — Vite gives each build a new
    # filename, so a stale cache is never actually a problem.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
